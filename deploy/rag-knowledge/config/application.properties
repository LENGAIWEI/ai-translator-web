# ============================================================================
#  外置配置：放在 jar 同级的 config/ 目录下，优先级高于 jar 内部的配置。
#  改这里不需要重新打包，改完执行 ./restart.sh 即可。
#
#  完整可选项见源码工程 src/main/resources/application.properties
# ============================================================================

# 服务端口（同一台服务器上如果还有别的应用，注意错开）
server.port=8081

# ============================================================================
#  密钥：必填，否则上传文档和提问都会失败
# ----------------------------------------------------------------------------
#  两种填法，二选一：
#    1) 用环境变量（宝塔「Java 项目」的启动参数里配，推荐生产环境）
#       填下面这样，然后在面板里设置 AI_API_KEY / AI_EMBEDDING_API_KEY
#    2) 直接把 Key 写在等号后面（简单，但这个文件要保管好）
#
#  密钥在源码工程的 application-local.properties 里，复制过来即可。
# ============================================================================

# 对话模型（用于改写问题 + 依据片段作答）
ai.api-key=${AI_API_KEY:}
ai.api-url=https://api.deepseek.com/v1/chat/completions
ai.model=deepseek-chat

# 向量化 Embedding（与对话模型是两套独立的接口和 Key）
ai.embedding-api-key=${AI_EMBEDDING_API_KEY:}
ai.embedding-api-url=https://open.bigmodel.cn/api/paas/v4/embeddings
ai.embedding-model=embedding-3

# ============================================================================
#  知识库落盘文件：相对「应用启动目录」，必须和 jar 同一层。
#  这就是知识库本身，升级换 jar 时千万不要删它。
# ============================================================================
kb.store-path=data/knowledge-base.json

# ============================================================================
#  前端页面外置（改页面不用重新打包）
# ----------------------------------------------------------------------------
#  打开后：把改好的 index.html / eval.html 放到 jar 同级的 static/ 目录即可覆盖 jar 里的页面。
#    mkdir -p static && 上传 index.html 到那个目录，然后浏览器 Ctrl+F5 强刷，不用重启。
#  注意末尾的斜杠不能少。目录不存在或文件缺失时会自动回退到 jar 内置的页面，不会出问题。
# ============================================================================
spring.web.resources.static-locations=file:./static/,classpath:/static/

# 上传文件大小限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
