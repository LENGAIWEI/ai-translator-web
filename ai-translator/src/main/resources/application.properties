spring.application.name=ai-translator

# ===== 服务端口 =====
# 宝塔上如果同时部署「RAG 知识库」，请保证两个应用端口不同（本应用默认 8080）。
server.port=8080

# ===== AI 接口配置 =====
# 可在此修改默认值；运行时也可在页面右上角「设置」中动态修改（重启后恢复为这里的默认值）。
# 注意：api-key 属于敏感信息，请妥善保管，不要提交到公开仓库。
# 密钥不入库：启动前设置环境变量 AI_API_KEY，或在页面右上角「设置」里填写。
ai.api-key=${AI_API_KEY:}
ai.api-url=https://api.deepseek.com/v1/chat/completions
ai.model=deepseek-chat
